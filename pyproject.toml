[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "belwara"
version = "0.2.0"
description = "Receipt extraction, spending history and assistant API."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "azure-identity>=1.19.0",
    "azure-monitor-opentelemetry>=1.6.0",
    "azure-storage-blob>=12.20.0",
    "bcrypt>=4.0.0",
    "fastapi>=0.129.0",
    "openai>=2.0.0",
    "pillow>=10.0.0",
    "psycopg2-binary>=2.9.11",
    "pymupdf>=1.25.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.22",
    "requests>=2.32.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# Eval cases and judge rubrics are mostly literal prose; wrapping them hurts readability.
"evals/cases/*" = ["E501"]
"evals/judge.py" = ["E501"]
